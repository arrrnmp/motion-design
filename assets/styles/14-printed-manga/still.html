<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@900&family=Comic+Neue:wght@700&family=Bangers&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#efe6d2}canvas#out{display:block}main canvas.p5Canvas{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js"></script>
<script src="../../lib/hershey.js"></script>
</head><body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
/* PRINTED MANGA (v2) — three plates, printed: an INK plate hand-inked with a G-pen (p5.brush:
   tapered strokes, hatching that breaks, panel borders drawn freehand), a TONE plate screened as
   real halftone (dot size follows the tone value), and one vermilion SPOT plate, out of register.
   Cream stock, paper speckle, rough ink transfer. Motion rule: panel-to-panel camera pushes, holds,
   smash cuts; impact frames invert; lines boil on twos when anything moves. */
window.__ready = false;
const W = 1920, H = 1080;
const PAPER = [239, 230, 210], NAVY = [38, 42, 82], VERM = [236, 84, 44];
let R; const rng = s => () => ((s = (s * 16807) % 2147483647) / 2147483647);
const J = a => (R() * 2 - 1) * a;
const P1 = [[40, 40], [905, 40], [790, 1040], [40, 1040]], P2 = [[930, 40], [1880, 40], [1880, 515], [872, 515]], P3 = [[869, 541], [1880, 541], [1880, 1040], [815, 1040]];
const ell = (cx, cy, rx, ry, n = 48, a0 = 0, sw = 1) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + i / n * Math.PI * 2 * sw; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });
const halfD = (cx, cy, rx, ry, side) => { const pts = []; for (let i = 0; i <= 32; i++) { const a = -Math.PI / 2 + i / 32 * Math.PI; pts.push([cx + side * Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return pts; };
const rotPts = (pts, cx, cy, a) => pts.map(([x, y]) => [cx + (x - cx) * Math.cos(a) - (y - cy) * Math.sin(a), cy + (x - cx) * Math.sin(a) + (y - cy) * Math.cos(a)]);

// ---------------------------------------------------------------- INK plate (p5.brush)
function pen(pts, w = 1, br = 'gpen', curv = 0.4) { brush.noFill(); brush.noHatch(); brush.noWash(); brush.set(br, '#000000', w); brush.spline(pts, curv); }
function line2(x0, y0, x1, y1, w, br = 'gpen') { brush.noFill(); brush.noHatch(); brush.noWash(); brush.set(br, '#000000', w); brush.line(x0, y0, x1, y1); }
// a freehand closed outline: drawn as 2-3 overlapping strokes that don't quite meet
function outline(pts, w = 1.2) {
  const n = pts.length, cut = Math.floor(n * (0.3 + R() * 0.3));
  pen(pts.slice(0, cut + 2).map(([x, y]) => [x + J(1.2), y + J(1.2)]), w);
  pen(pts.slice(cut - 1).concat([pts[1]]).map(([x, y]) => [x + J(1.2), y + J(1.2)]), w * (0.85 + R() * 0.3));
}
// hand hatching inside a polygon: short parallel strokes, some broken, lengths vary
function hatch(poly, ang, gap, w = 0.55, coverage = 1) {
  const c = Math.cos(ang), s = Math.sin(ang), rp = poly.map(([x, y]) => [x * c + y * s, -x * s + y * c]);
  const ys = rp.map(p => p[1]);
  for (let y = Math.min(...ys) + gap / 2; y < Math.max(...ys); y += gap * (0.8 + R() * 0.4)) {
    const xs = [];
    for (let i = 0; i < rp.length; i++) { const [ax, ay] = rp[i], [bx, by] = rp[(i + 1) % rp.length]; if ((ay <= y && by > y) || (by <= y && ay > y)) xs.push(ax + (y - ay) / (by - ay) * (bx - ax)); }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      let a = xs[k] + 3 + R() * 6, b = xs[k + 1] - R() * 10;
      b = a + (b - a) * coverage * (0.6 + R() * 0.4);
      if (b - a < 6) continue;
      const brk = R() < 0.3 ? a + (b - a) * (0.3 + R() * 0.4) : null;        // broken stroke
      const seg = (u, v) => { const p0 = [u * c - y * s, u * s + y * c], p1 = [v * c - y * s, v * s + y * c]; line2(p0[0], p0[1], p1[0], p1[1], w, 'hatchpen'); };
      if (brk) { seg(a, brk - 4); seg(brk + 5, b); } else seg(a, b);
    }
  }
}
function clipSeg(x0, y0, x1, y1, poly) {
  let t0 = 0, t1 = 1; const dx = x1 - x0, dy = y1 - y0;
  let area = 0; for (let i = 0; i < poly.length; i++) { const [a, b] = [poly[i], poly[(i + 1) % poly.length]]; area += a[0] * b[1] - b[0] * a[1]; }
  const sgn = area > 0 ? 1 : -1;
  for (let i = 0; i < poly.length; i++) {
    const [ax, ay] = poly[i], [bx, by] = poly[(i + 1) % poly.length];
    const nx = -(by - ay) * sgn, ny = (bx - ax) * sgn;           // inward normal
    const num = nx * (x0 - ax) + ny * (y0 - ay), den = nx * dx + ny * dy;
    if (Math.abs(den) < 1e-9) { if (num < 0) return null; continue; }
    const t = -num / den;
    if (den > 0) t0 = Math.max(t0, t); else t1 = Math.min(t1, t);
    if (t0 > t1) return null;
  }
  return [x0 + dx * t0, y0 + dy * t0, x0 + dx * t1, y0 + dy * t1];
}
const INSET = (P, d) => { const cx = P.reduce((a, p) => a + p[0], 0) / P.length, cy = P.reduce((a, p) => a + p[1], 0) / P.length; return P.map(([x, y]) => { const l = Math.hypot(x - cx, y - cy); return [x - (x - cx) / l * d, y - (y - cy) / l * d]; }); };
function speedLines(cx, cy, n, r0, r1, wmax, clipPoly) {
  for (let i = 0; i < n; i++) {
    const a = R() * Math.PI * 2, rs = r0 + R() * 120, re = r1 * (0.8 + R() * 0.4);
    const c = clipSeg(cx + Math.cos(a) * re, cy + Math.sin(a) * re, cx + Math.cos(a) * rs, cy + Math.sin(a) * rs, clipPoly);
    if (!c || Math.hypot(c[2] - c[0], c[3] - c[1]) < 20) continue;
    brush.noFill(); brush.noHatch(); brush.set('speed', '#000000', 0.6 + R() * wmax);
    brush.line(c[0], c[1], c[2], c[3]);
  }
}
function sfx(text, x, y, size, rot, w) {
  const { polys } = hersheyPolys(text, 'futural', x, y, size, { track: 4 });
  polys.forEach(p => pen(rotPts(p.pts, x, y, rot).map(([px, py]) => [px + J(1.5), py + J(1.5)]), w, 'brushpen', 0.2));
}

// ---------------------------------------------------------------- TONE + SPOT plates (2D canvases, density in alpha)
const plate = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d'); };
const polyPath = (g, pts) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
const fillD = (g, pts, d) => { g.fillStyle = `rgba(0,0,0,${d})`; polyPath(g, pts); g.fill(); };

// ---------------------------------------------------------------- scene
let TONE, SPOT, TXT;
const BEANS = [[1110, 260, 0.4], [1200, 330, -0.6], [1285, 235, 1.2], [1370, 330, 0.2], [1455, 245, -1.0], [1540, 320, 0.7], [1330, 170, 1.9]];
function drawScene() {
  // --- panel 1: the cherry snaps open
  push(); // clip not available for brush; keep strokes inside by geometry
  speedLines(420, 600, 170, 330, 900, 2.6, INSET(P1, 8));
  pop();
  const L = rotPts(halfD(270, 600, 250, 310, -1), 270, 600, -0.17), Li = rotPts(halfD(270, 600, 200, 265, -1), 270, 600, -0.17);
  const Rr = rotPts(halfD(590, 600, 250, 310, 1), 590, 600, 0.17), Ri = rotPts(halfD(590, 600, 200, 265, 1), 590, 600, 0.17);
  [L, Rr].forEach(p => outline(p.concat([p[0]]), 3));
  [Li, Ri].forEach(p => pen(p, 1.3));
  hatch(Li, 0.7, 13, 0.5, 0.55);
  const seedL = halfD(425, 610, 110, 165, -1), seedR = halfD(437, 610, 110, 165, 1);
  [seedL, seedR].forEach(p => outline(p.concat([p[0]]), 2.4));
  pen([[378, 485], [398, 540], [362, 592], [386, 650], [376, 730]], 1);
  pen([[484, 485], [464, 540], [500, 592], [476, 650], [488, 730]], 1);
  hatch(seedR.map(([x, y]) => [x - 4, y]), -0.9, 11, 0.5, 0.5);
  [[610, 410, 48], [245, 810, 32], [570, 830, 22]].forEach(([x, y, s]) => { pen([[x, y - s], [x + s * .15, y - s * .15], [x + s, y], [x + s * .15, y + s * .15], [x, y + s], [x - s * .15, y + s * .15], [x - s, y], [x - s * .15, y - s * .15], [x, y - s]], 0.9, 'gpen', 0); });

  // --- panel 2: roaster, first crack
  for (let i = 0; i < 28; i++) { const y = 62 + i * 16 + J(4), c = clipSeg(1880, y, 900 + R() * 240, y + J(3), INSET(P2, 8)); if (c) line2(c[0], c[1], c[2], c[3], 0.5 + R() * 0.5, 'speed'); }
  outline(ell(1330, 290, 330, 190, 64), 2.8); outline(ell(1330, 290, 280, 150, 60), 1.6);
  BEANS.forEach(([x, y, r]) => {
    const b = rotPts(ell(x, y, 34, 50, 24), x, y, r); outline(b, 2);
    pen(rotPts([[x - 2, y - 42], [x + 12, y - 12], [x - 12, y + 14], [x + 2, y + 42]], x, y, r), 1);
    hatch(rotPts(halfD(x + 4, y, 30, 46, 1), x, y, r), r + 0.8, 7, 0.45, 0.8);
  });
  [[1180, 170, 1140, 110], [1320, 130, 1320, 60], [1460, 160, 1500, 100], [1540, 230, 1610, 200]].forEach(([a, b, c, d]) => line2(a, b, c, d, 2.2, 'brushpen'));

  // --- panel 3: the cup
  outline(ell(1480, 960, 420, 80, 64), 2.4);
  outline([[1250, 760], [1710, 760], [1670, 960], [1480, 990], [1290, 960], [1250, 760]], 2.8);
  pen(ell(1745, 855, 62, 62, 30, -1.4, 0.48), 3.2, 'brushpen');
  outline(ell(1480, 760, 230, 40, 48), 2.2);
  hatch([[1600, 780], [1705, 770], [1668, 950], [1590, 968]], 0.9, 10, 0.5, 0.85);
  [1400, 1480, 1560].forEach(x => pen([[x, 720], [x - 30, 670], [x + 28, 640], [x - 8, 590]], 1, 'gpen'));
  outline(ell(1030, 700, 150, 80, 40), 1.1);
  outline(ell(1180, 790, 16, 16, 16), 0.9); outline(ell(1215, 825, 9, 9, 12), 0.8);

  // --- panel borders, freehand
  [P1, P2, P3].forEach(P => { for (let i = 0; i < 4; i++) { const [a, b] = [P[i], P[(i + 1) % 4]]; pen([[a[0] + J(2), a[1] + J(2)], [(a[0] + b[0]) / 2 + J(2), (a[1] + b[1]) / 2 + J(2)], [b[0] + J(2), b[1] + J(2)]], 2.4, 'border', 0.2); } });
}

function drawTone(g) {
  // panel 1: burst of light behind (radial gradient tone), cherry skin shadow
  g.save(); polyPath(g, P1); g.clip();
  const gr = g.createRadialGradient(430, 600, 180, 430, 600, 700); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H); g.restore();
  // cherry halves: flesh light tone (knock the burst out first)
  const L = rotPts(halfD(270, 600, 250, 310, -1), 270, 600, -0.17), Rr = rotPts(halfD(590, 600, 250, 310, 1), 590, 600, 0.17);
  g.globalCompositeOperation = 'destination-out'; [L, Rr].forEach(p => fillD(g, p, 1)); fillD(g, ell(431, 610, 118, 170), 1); g.globalCompositeOperation = 'source-over';
  [[270, -0.17, -1], [590, 0.17, 1]].forEach(([cx, a, sd]) => fillD(g, rotPts(halfD(cx + 3, 604, 200, 265, sd), cx, 600, a), 0.16));
  fillD(g, halfD(441, 612, 110, 165, 1).map(([x, y]) => [x + 30, y]), 0.0);
  // panel 2: flat mid tone + drum interior darker
  g.save(); polyPath(g, P2); g.clip(); g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'destination-out'; fillD(g, ell(1330, 290, 330, 190), 1); g.globalCompositeOperation = 'source-over';
  fillD(g, ell(1334, 294, 280, 150), 0.34);
  g.globalCompositeOperation = 'destination-out'; BEANS.forEach(([x, y, r]) => fillD(g, rotPts(ell(x, y, 34, 50, 24), x, y, r), 1)); g.globalCompositeOperation = 'source-over'; g.restore();
  // panel 3: gradient screentone from the bottom, cup knocked out, coffee dark
  g.save(); polyPath(g, P3); g.clip();
  const g3 = g.createLinearGradient(0, 560, 0, 1040); g3.addColorStop(0, 'rgba(0,0,0,0)'); g3.addColorStop(1, 'rgba(0,0,0,.7)');
  g.fillStyle = g3; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'destination-out'; fillD(g, [[1250, 760], [1710, 760], [1670, 960], [1480, 990], [1290, 960]], 1); fillD(g, ell(1480, 960, 420, 80), 1); fillD(g, ell(1030, 700, 150, 80), 1); g.globalCompositeOperation = 'source-over';
  fillD(g, ell(1482, 763, 226, 38), 0.8); fillD(g, ell(1480, 962, 400, 60), 0.12);
  g.restore();
}
function drawSpot(g) {
  // vermilion: cherry skin (solid) + SFX fills + steam glow + a few flecks
  const L = rotPts(halfD(270, 600, 250, 310, -1), 270, 600, -0.17), Li = rotPts(halfD(270, 600, 200, 265, -1), 270, 600, -0.17);
  const Rr = rotPts(halfD(590, 600, 250, 310, 1), 590, 600, 0.17), Ri = rotPts(halfD(590, 600, 200, 265, 1), 590, 600, 0.17);
  [[L, Li], [Rr, Ri]].forEach(([o, i]) => { fillD(g, o, 1); g.globalCompositeOperation = 'destination-out'; fillD(g, i, 1); g.globalCompositeOperation = 'source-over'; });
  fillD(g, ell(1482, 763, 226, 38), 0.35);
}

// ---------------------------------------------------------------- print
function coverage(src, ink, cell, angDeg, solid) {
  const a = src.getImageData(0, 0, W, H).data, cov = new Float32Array(W * H);
  const th = angDeg * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th), k = 2 * Math.PI / cell;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    let d = ink ? (255 - a[i * 4]) / 255 * (a[i * 4 + 3] / 255) : a[i * 4 + 3] / 255;   // ink canvas: dark pixels
    if (d < 0.02) continue;
    let c;
    if (solid || d > 0.97) c = d;
    else { const u = (x * cs + y * sn) * k, v = (-x * sn + y * cs) * k; c = d > 1 - (0.5 + 0.25 * (Math.cos(u) + Math.cos(v))) ? 1 : 0; }
    if (c && R() < 0.025) c *= 0.3;      // speckle voids
    cov[i] = c;
  }
  return cov;
}

async function setup() {
  const cnv = createCanvas(W, H, WEBGL); pixelDensity(1); noLoop();
  cnv.elt.style.display = 'none';
  window.HERSHEY = await (await fetch('../../lib/hershey.json')).json();
  await document.fonts.load('900 60px "Zen Kaku Gothic New"'); await document.fonts.load('100px Bangers'); await document.fonts.load('700 30px "Comic Neue"');
  brush.scaleBrushes(3.2);
  brush.add('gpen', { type: 'default', weight: 1.6, scatter: 0.08, sharpness: 0.95, grain: 60, opacity: 250, spacing: 0.15, pressure: [1.35, 0.35], rotate: 'natural', noise: 0.08 });
  brush.add('hatchpen', { type: 'default', weight: 1.1, scatter: 0.05, sharpness: 0.95, grain: 60, opacity: 240, spacing: 0.15, pressure: [1.2, 0.3], rotate: 'natural', noise: 0.05 });
  brush.add('speed', { type: 'default', weight: 1.4, scatter: 0.04, sharpness: 0.95, grain: 60, opacity: 250, spacing: 0.15, pressure: [0.2, 1.6], rotate: 'natural', noise: 0.04 });
  brush.add('brushpen', { type: 'default', weight: 3.2, scatter: 0.2, sharpness: 0.8, grain: 30, opacity: 250, spacing: 0.15, pressure: [1.3, 0.5], rotate: 'natural', noise: 0.15 });
  brush.add('border', { type: 'default', weight: 2.4, scatter: 0.1, sharpness: 0.9, grain: 50, opacity: 250, spacing: 0.15, pressure: [1.05, 0.9], rotate: 'natural', noise: 0.1 });
  redraw();
}

function draw() {
  R = rng(4242); randomSeed(9); noiseSeed(9);
  clear(); background(255);
  translate(-W / 2, -H / 2);
  drawScene();
  brush.noStroke(); brush.fill('#ffffff', 1); brush.polygon([[-50, -50], [-40, -50], [-40, -40]]);  // flush brush buffers
  setTimeout(finish, 50);
}

function finish() {
  // ink plate from the p5 canvas (black strokes on white) + typeset lettering drawn straight into it
  const ink = plate(); ink.drawImage(document.querySelector('canvas.p5Canvas') || _renderer.elt, 0, 0);
  // chapter caption: navy box, knocked-out title; caption boxes with typeset text
  ink.fillStyle = '#000'; ink.fillRect(72, 72, 560, 178);
  ink.fillStyle = '#fff'; ink.font = '900 56px "Zen Kaku Gothic New"'; ink.fillText('From cherry', 100, 138); ink.fillText('to cup', 100, 212);
  ink.font = '700 24px "Comic Neue"'; ink.textAlign = 'right'; ink.fillText('ch.1', 604, 228); ink.textAlign = 'left';
  ink.fillStyle = '#fff'; ink.fillRect(930, 420, 402, 72); ink.strokeStyle = '#000'; ink.lineWidth = 4; ink.strokeRect(930, 420, 402, 72);
  ink.fillStyle = '#000'; ink.font = '700 30px "Comic Neue"'; ink.fillText('The beans pop as they roast.', 948, 467);
  ink.font = '700 44px "Comic Neue"'; ink.textAlign = 'center'; ink.fillText('…ahh.', 1030, 714);

  const tone = plate(); drawTone(tone);
  tone.clearRect(926, 416, 410, 80); tone.clearRect(68, 68, 568, 186);
  const spot = plate(); drawSpot(spot);
  // SFX: vermilion fill on the spot plate, a heavy ink keyline on the ink plate (with a paper gap between)
  [['SNAP!!', 360, 1010, 200, -0.14], ['CRACK!', 1500, 185, 140, 0.14], ['sip', 1650, 670, 100, -0.1]].forEach(([t, x, y, s, r]) => {
    for (const [g, mode] of [[ink, 'key'], [spot, 'fill']]) {
      g.save(); g.translate(x, y); g.rotate(r); g.font = `${s}px Bangers`; g.lineJoin = 'round'; g.textAlign = 'left';
      if (mode === 'key') { g.strokeStyle = '#000'; g.lineWidth = s * 0.16; g.strokeText(t, 0, 0); g.strokeStyle = '#fff'; g.lineWidth = s * 0.07; g.strokeText(t, 0, 0); g.fillStyle = '#fff'; g.fillText(t, 0, 0); }
      else { g.fillStyle = '#000'; g.fillText(t, 0, 0); }
      g.restore();
    }
  });

  const covInk = coverage(ink, true, 0, 0, true), covTone = coverage(tone, false, 8, 45, false), covSpot = coverage(spot, false, 9, 15, false);
  const out = document.getElementById('out').getContext('2d'), img = out.createImageData(W, H), px = img.data;
  const OFF = [5, -3];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, o = i * 4, f = 1 - 0.03 * R();
    let c = PAPER.map(v => v * f);
    const sx = x - OFF[0], sy = y - OFF[1];
    const vs = sx >= 0 && sy >= 0 && sx < W && sy < H ? covSpot[sy * W + sx] : 0;
    if (vs) c = c.map((ch, k) => ch * (1 - vs * (1 - VERM[k] / 255)));
    const vn = Math.max(covInk[i], covTone[i]);
    if (vn) c = c.map((ch, k) => ch * (1 - vn * 0.96 * (1 - NAVY[k] / 255)));
    px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2]; px[o + 3] = 255;
  }
  out.putImageData(img, 0, 0);
  window.__ready = true;
}
</script>
</body></html>
