<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#f2ede3}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* LINOCUT — relief print. Key block: solid ink with everything that should be white CARVED away by
   tapered gouge strokes (rays, hatching, outlines, title). Red block printed first, key on top,
   slightly out of register. Ink transfer: rough edges, speckle voids, uneven roller.
   Motion rule: reveal by carving (gouge strokes appear in order) or by pulling the print (paper
   peels up from the block); stepped at 12fps. */
window.__ready = false;
const W = 1920, H = 1080;
let seed = 31; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const perm = Array.from({ length: 512 }, rnd);
function vn(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, s = t => t * t * (3 - 2 * t);
  const h = (a, b) => perm[(((a * 57 + b * 131) % 512) + 512) % 512];
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  return a + (b - a) * s(xf) + (c - a) * s(yf) + (a - b - c + d) * s(xf) * s(yf); }
const layer = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d'); };

// tapered gouge: a lens-shaped cut between two points, bowed slightly
function gouge(ctx, x1, y1, x2, y2, w, bow = 0) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  const mx = (x1 + x2) / 2 + nx * bow, my = (y1 + y2) / 2 + ny * bow;
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(mx + nx * w, my + ny * w, x2, y2);
  ctx.quadraticCurveTo(mx - nx * w, my - ny * w, x1, y1); ctx.fill();
}
const SUN = [1440, 360];

function keyBlock(k) {
  k.fillStyle = '#000';
  // block with slightly irregular edge
  k.beginPath(); k.moveTo(70, 66);
  for (let x = 70; x <= 1850; x += 30) k.lineTo(x, 66 + (rnd() - .5) * 6);
  for (let y = 66; y <= 1014; y += 30) k.lineTo(1850 + (rnd() - .5) * 6, y);
  for (let x = 1850; x >= 70; x -= 30) k.lineTo(x, 1014 + (rnd() - .5) * 6);
  for (let y = 1014; y >= 66; y -= 30) k.lineTo(70 + (rnd() - .5) * 6, y);
  k.fill();
  k.globalCompositeOperation = 'destination-out';
  // sun: clean disc + alternating carved rays
  k.beginPath(); k.arc(SUN[0], SUN[1], 150, 0, 7); k.fill();
  for (let i = 0; i < 36; i++) {
    const a = i / 36 * Math.PI * 2 + 0.05, r0 = 175, r1 = 1300;
    const w = 26 + rnd() * 10;
    gouge(k, SUN[0] + Math.cos(a) * r0, SUN[1] + Math.sin(a) * r0, SUN[0] + Math.cos(a) * r1, SUN[1] + Math.sin(a) * r1, w, (rnd() - .5) * 30);
  }
  // hillside ground: wavy horizontal gouges
  for (let y = 860; y < 1010; y += 17) for (let x = 80; x < 1840; x += 140 + rnd() * 60) {
    const len = 90 + rnd() * 90; gouge(k, x, y + Math.sin(x / 90) * 8, x + len, y + Math.sin((x + len) / 90) * 8, 4 + rnd() * 2, (rnd() - .5) * 8);
  }
  k.globalCompositeOperation = 'source-over';

  // solid masses over the rays: carve a white halo first, then re-ink the shape (classic lino outline)
  const leaves = [[260, 760, 300, 90, -1.2], [430, 640, 280, 84, -2.0], [520, 640, 300, 88, 0.1], [700, 540, 260, 76, -0.7], [180, 900, 250, 80, 0.4]];
  const leafPath = ([x, y, l, w, r]) => { k.save(); k.translate(x, y); k.rotate(r);
    k.beginPath(); k.moveTo(0, 0); k.bezierCurveTo(l * .3, -w, l * .75, -w * .9, l, 0); k.bezierCurveTo(l * .75, w * .9, l * .3, w, 0, 0); k.restore(); };
  const branch = () => { k.beginPath(); k.moveTo(60, 1000); k.bezierCurveTo(260, 800, 420, 660, 760, 520); };
  const cupPath = () => { k.beginPath(); k.moveTo(1260, 610); k.lineTo(1640, 610); k.lineTo(1600, 900); k.lineTo(1300, 900); k.closePath(); };
  const handle = () => { k.beginPath(); k.arc(1650, 720, 70, -1.4, 1.4); };
  const saucer = () => { k.beginPath(); k.ellipse(1450, 910, 300, 40, 0, 0, 7); };
  k.lineCap = 'round'; k.lineJoin = 'round';
  // pass 1: halos
  k.globalCompositeOperation = 'destination-out'; k.strokeStyle = '#000'; k.fillStyle = '#000';
  k.lineWidth = 34 + 26; branch(); k.stroke();
  k.lineWidth = 24; leaves.forEach(L => { leafPath(L); k.stroke(); k.fill(); });
  cupPath(); k.stroke(); k.fill(); k.lineWidth = 36 + 24; handle(); k.stroke(); k.lineWidth = 24; saucer(); k.stroke(); k.fill();
  k.fillRect(100, 70, 1060, 290);  // clear the title zone of rays...
  // pass 2: re-ink
  k.globalCompositeOperation = 'source-over';
  k.fillRect(118, 86, 1024, 258);  // ...and re-ink it as a solid panel with a carved border gap
  k.lineWidth = 34; branch(); k.stroke();
  leaves.forEach(L => { leafPath(L); k.fill(); });
  cupPath(); k.fill(); k.lineWidth = 36; handle(); k.stroke(); saucer(); k.fill();

  k.globalCompositeOperation = 'destination-out';
  // leaf veins + carved outline gap
  leaves.forEach(([x, y, l, w, r]) => { k.save(); k.translate(x, y); k.rotate(r);
    gouge(k, 16, 0, l - 20, 0, 5);
    for (let t = 0.2; t < 0.9; t += 0.14) { const px = l * t; gouge(k, px, 0, px + 40, -w * 0.62 * (1 - Math.abs(t - .45)), 3.5, 6); gouge(k, px, 0, px + 40, w * 0.62 * (1 - Math.abs(t - .45)), 3.5, -6); }
    k.restore(); });
  // cherries: carved holes (red block prints into them) with a black crescent kept later
  CHERRIES.forEach(([x, y, r]) => { k.beginPath(); k.arc(x, y, r + 6, 0, 7); k.fill(); });
  // cup: carved outline + curved hatching for form + rim
  k.lineWidth = 8; k.strokeStyle = '#000';
  for (let i = 0; i < 9; i++) { const y = 650 + i * 28, t = (y - 610) / 290, xl = 1260 + 40 * t + 24, xr = 1640 - 40 * t - 24 - i * 14;
    gouge(k, xl + i * 6, y, xr, y + 6, 4, 10); }
  k.beginPath(); k.ellipse(1450, 610, 190, 28, 0, 0, 7); k.fill();
  gouge(k, 1180, 912, 1720, 912, 4, 0);
  // steam
  [1380, 1450, 1520].forEach((x, i) => { for (let j = 0; j < 5; j++) { const y = 575 - j * 42; gouge(k, x + (j % 2 ? -18 : 18), y, x + (j % 2 ? 18 : -18), y - 42, 7, (j % 2 ? 14 : -14)); } });
  // title, carved
  k.font = '118px "Alfa Slab One"'; k.textBaseline = 'alphabetic';
  k.fillText('FROM CHERRY', 150, 205); k.fillText('TO CUP', 150, 322);
  k.globalCompositeOperation = 'source-over';
  // put back black crescents inside cherries (shadow side) + stems
  k.fillStyle = '#000';
  CHERRIES.forEach(([x, y, r]) => { k.save(); k.beginPath(); k.arc(x, y, r, 0, 7); k.clip();
    k.beginPath(); k.arc(x - r * .35, y - r * .35, r * 1.05, 0, 7); k.arc(x, y, r * 2, 0, 7, true); k.fill(); k.restore();
    k.lineWidth = 7; k.strokeStyle = '#000'; k.beginPath(); k.moveTo(x, y - r); k.lineTo(x + 10, y - r - 26); k.stroke(); });
}
const CHERRIES = [[330, 700, 44], [398, 716, 40], [352, 772, 42], [600, 590, 40], [660, 608, 42], [622, 660, 38], [150, 890, 40], [214, 906, 36]];

function redBlock(r) {
  r.fillStyle = '#000';
  r.beginPath(); r.arc(SUN[0], SUN[1], 160, 0, 7); r.fill();
  CHERRIES.forEach(([x, y, rad]) => { r.beginPath(); r.arc(x, y, rad + 10, 0, 7); r.fill(); });
  // coffee in the cup
  r.beginPath(); r.ellipse(1450, 612, 196, 32, 0, 0, 7); r.fill();
}

function inkCoverage(ctx, strength) {
  const a = ctx.getImageData(0, 0, W, H).data, cov = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    // rough edge: sample alpha at a noise-jittered position
    const jx = Math.round(x + (vn(x / 6, y / 6) - .5) * 5), jy = Math.round(y + (vn(x / 6 + 40, y / 6) - .5) * 5);
    if (jx < 0 || jy < 0 || jx >= W || jy >= H) continue;
    const d = a[(jy * W + jx) * 4 + 3] / 255; if (d < .5) continue;
    const roller = 0.8 + 0.2 * vn(x / 300, y / 60);
    const speck = rnd() < 0.03 + 0.05 * vn(x / 40, y / 40) ? 0.25 : 1;
    cov[y * W + x] = strength * roller * speck;
  }
  return cov;
}

async function main() {
  await document.fonts.load('118px "Alfa Slab One"');
  const k = layer(); keyBlock(k);
  const r = layer(); redBlock(r);
  const inks = [[[200, 50, 42], inkCoverage(r, 0.95), [0, 0]], [[27, 23, 20], inkCoverage(k, 0.97), [5, 3]]];
  const out = document.getElementById('c').getContext('2d'), img = out.createImageData(W, H), px = img.data;
  const PAPER = [242, 237, 227];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const o = (y * W + x) * 4, f = 1 - 0.035 * vn(x / 2, y / 9) - 0.02 * rnd();
    let c = PAPER.map(v => v * f);
    for (const [rgb, cov, [ox, oy]] of inks) {
      const sx = x - ox, sy = y - oy; if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
      const v = cov[sy * W + sx]; if (!v) continue;
      c = c.map((ch, i) => ch * (1 - v * (1 - rgb[i] / 255)));
    }
    px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2]; px[o + 3] = 255;
  }
  out.putImageData(img, 0, 0);
  window.__ready = true;
}
main();
</script></body></html>
